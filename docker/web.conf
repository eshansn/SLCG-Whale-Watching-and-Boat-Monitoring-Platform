map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# SignalR authenticates WebSockets with a query token; keep queries out of logs.
log_format web '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
               '$status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log web;
    client_max_body_size 30m;

    # Resolve the service again after Compose recreates the API container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8080;

    location ~ ^/(api|hubs)(/|$) {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /health/ready {
        proxy_pass $api_backend;
    }

    location = /health/live {
        proxy_pass $api_backend;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
